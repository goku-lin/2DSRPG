<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFlow 协同平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="mb-3">SmartFlow - ASP.NET 全栈项目示例</h2>
  <div class="card mb-3">
    <div class="card-body row g-2">
      <div class="col-md-4"><input id="username" class="form-control" value="admin"></div>
      <div class="col-md-4"><input id="password" type="password" class="form-control" value="Admin@123"></div>
      <div class="col-md-4"><button id="loginBtn" class="btn btn-primary w-100">登录</button></div>
    </div>
  </div>

  <div id="main" class="d-none">
    <div class="card mb-3">
      <div class="card-header">项目列表</div>
      <ul id="projectList" class="list-group list-group-flush"></ul>
    </div>

    <div class="row g-3">
      <div class="col-md-7">
        <div class="card">
          <div class="card-header">任务看板</div>
          <div id="tasks" class="card-body"></div>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card mb-3"><div class="card-header">燃尽图</div><div class="card-body"><canvas id="burndown"></canvas></div></div>
        <div class="card"><div class="card-header">风险任务</div><ul id="riskTasks" class="list-group list-group-flush"></ul></div>
      </div>
    </div>
    <div class="mt-3"><pre id="log" class="bg-dark text-light p-3 rounded" style="height:150px; overflow:auto;"></pre></div>
  </div>
</div>

<script>
let token = "";
let currentProjectId = "";
let burndownChart;

const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent += `\n${new Date().toLocaleTimeString()} - ${msg}`;
  el.scrollTop = el.scrollHeight;
};

async function api(url, method='GET', body=null) {
  const options = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }};
  if (body) options.body = JSON.stringify(body);
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

document.getElementById('loginBtn').onclick = async () => {
  try {
    const payload = {
      userName: document.getElementById('username').value,
      password: document.getElementById('password').value
    };
    const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    token = data.token;
    document.getElementById('main').classList.remove('d-none');
    log(`登录成功: ${data.userName} (${data.role})`);
    await loadProjects();
  } catch (err) {
    alert(err.message);
  }
};

async function loadProjects() {
  const projects = await api('/api/projects');
  const list = document.getElementById('projectList');
  list.innerHTML = '';
  projects.forEach(p => {
    const li = document.createElement('li');
    li.className = 'list-group-item d-flex justify-content-between align-items-center';
    li.innerHTML = `<span>${p.name} (${p.status})</span><button class='btn btn-sm btn-outline-primary'>进入</button>`;
    li.querySelector('button').onclick = () => openProject(p.id);
    list.appendChild(li);
  });
}

async function openProject(projectId) {
  currentProjectId = projectId;
  const [tasks, dashboard] = await Promise.all([
    api(`/api/tasks/project/${projectId}`),
    api(`/api/projects/${projectId}/dashboard`)
  ]);

  document.getElementById('tasks').innerHTML = tasks.map(t =>
      `<div class='border rounded p-2 mb-2'><strong>${t.title}</strong><br>状态: ${t.status} | 优先级: ${t.priority} | SP: ${t.storyPoint}</div>`
  ).join('');

  const risk = document.getElementById('riskTasks');
  risk.innerHTML = dashboard.riskTasks.map(item => `<li class='list-group-item text-danger'>${item}</li>`).join('');

  const ctx = document.getElementById('burndown');
  if (burndownChart) burndownChart.destroy();
  burndownChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dashboard.burndown.map(x => x.day),
      datasets: [{
        label: '剩余点数',
        data: dashboard.burndown.map(x => x.remainingPoints),
        borderColor: '#0d6efd'
      }]
    }
  });

  await connectHub(projectId);
}

async function connectHub(projectId) {
  const connection = new signalR.HubConnectionBuilder()
    .withUrl(`/hubs/notifications?access_token=${token}`)
    .withAutomaticReconnect()
    .build();

  connection.on('TaskCreated', t => log(`新任务创建: ${t.title}`));
  connection.on('TaskMoved', t => log(`任务状态更新: ${t.id} -> ${t.status}`));

  await connection.start();
  await connection.invoke('JoinProject', projectId);
  log(`已连接实时通知`);
}
</script>
</body>
</html>
